name: CI/CD Pipeline - DOSW Library

on:
  pull_request:
    branches:
      - main

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Configurar Java 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Compilar proyecto (fase compile)
        run: mvn compile -DskipTests

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Configurar Java 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Ejecutar pruebas (fase verify)
        run: mvn verify -DSPRING_DATA_MONGODB_URI=${{ secrets.MONGODB_URI }} -Dspring.profiles.active=mongo

  analysis:
    name: Analysis
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Configurar Java 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Análisis estático con SonarCloud
        run: |
          mvn verify sonar:sonar \
            -Dsonar.projectKey=diegoale8504-hub_DOSW-Library \
            -Dsonar.organization=diegoale8504-hub \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -DSPRING_DATA_MONGODB_URI=${{ secrets.MONGODB_URI }} \
            -Dspring.profiles.active=mongo

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Deploy (en construcción)
        run: echo "En construcción ..."