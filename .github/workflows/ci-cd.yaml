name: CI/CD Pipeline - DOSW Library

on:
  pull_request:
    branches:
      - main

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Configurar Java 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Dar permisos a mvnw
        run: chmod +x ./mvnw

      - name: Compilar proyecto (fase compile)
        run: ./mvnw compile -DskipTests

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Configurar Java 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Dar permisos a mvnw
        run: chmod +x ./mvnw

      - name: Ejecutar pruebas (fase verify)
        run: ./mvnw verify -DSPRING_DATA_MONGODB_URI=${{ secrets.MONGODB_URI }} -Dspring.profiles.active=mongo

  analysis:
    name: Analysis
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Configurar Java 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Dar permisos a mvnw
        run: chmod +x ./mvnw

      - name: Análisis estático con SonarCloud
        run: |
          ./mvnw verify sonar:sonar \
            -Dsonar.projectKey=diegoale8504-hub_DOSW-Library \
            -Dsonar.organization=diegoale8504-hub \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -DSPRING_DATA_MONGODB_URI=${{ secrets.MONGODB_URI }} \
            -Dspring.profiles.active=mongo

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Configurar Java 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Dar permisos a mvnw
        run: chmod +x ./mvnw

      - name: Build JAR
        run: ./mvnw package -DskipTests -Dspring.profiles.active=mongo

      - name: Deploy a Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'dosw-library-diego'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: target/*.jar